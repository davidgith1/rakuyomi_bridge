name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    secrets:
      KEYSTORE_CONTENT:
        required: true
      KEYSTORE_ALIAS:
        required: true
      KEYSTORE_PASSWORD:
        required: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bridge code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone RakuYomi
        uses: actions/checkout@v4
        with:
          repository: tachibana-shin/rakuyomi
          path: rakuyomi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rakuyomi/backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rakuyomi/backend/Cargo.lock') }}

      - name: Build Rust Android libraries (dev mode)
        env:
          BRIDGE_DIR: ${{ github.workspace }}
        run: bash rakuyomi/scripts/build-rust-android.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Write local.properties
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_CONTENT" | base64 --decode > release.keystore
          SHA256=$(keytool -list -v -keystore release.keystore -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA256: " | awk '{print $2}')
          echo "RELEASE_CERT_SHA256=$SHA256" >> local.properties
          rm release.keystore

      - name: Run Android Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Run Unit Tests
        run: ./gradlew :androidApp:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: androidApp/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.KEYSTORE_CONTENT }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Run Headless Lint
        run: ./gradlew :androidHeadless:lintDebug

      - name: Build Headless Debug APK
        run: ./gradlew :androidHeadless:assembleDebug

      - name: Sign Headless APK
        uses: r0adkll/sign-android-release@v1
        id: sign_headless
        with:
          releaseDirectory: androidHeadless/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.KEYSTORE_CONTENT }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload Headless APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-headless-apk-signed
          path: ${{ steps.sign_headless.outputs.signedReleaseFile }}
